<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nosso Caixa">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231e4a10'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2' fill='%23b9ef7a'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#e9e9e6;z-index:50;font-family:'Urbanist',system-ui,sans-serif}
#login .box{background:#fff;border-radius:28px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;color:#141414}
#login h1{margin:0;font-size:26px;letter-spacing:-.02em}
#login p{margin:0;color:#77776f;font-size:15px;line-height:1.5}
#login input{height:48px;border:1.5px solid #ebebe7;border-radius:14px;padding:0 14px;font:inherit;font-size:16px}
#login button{height:48px;border:0;border-radius:99px;background:#1e4a10;color:#fff;font:600 15px 'Urbanist',system-ui,sans-serif;cursor:pointer}
#login .duo{display:flex} #login .duo img{width:52px;height:52px;border-radius:50%;object-fit:cover} #login .duo img+img{margin-left:-14px;box-shadow:0 0 0 3px #fff}
#login .msg{font-size:14px;color:#2f6b12;background:none;padding:0;min-height:0} #login .erro{color:#d1453b}
body.travado .shell{visibility:hidden}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="supa.js"></script>
</head>
<body class="travado">
<div id="login" hidden><form class="box" id="fLogin">
  <div class="duo" id="loginDuo"></div>
  <h1>Nosso Caixa</h1>
  <p id="loginTxt">Entre com o seu e-mail e a senha.</p>
  <input id="loginEmail" name="email" type="email" autocomplete="username" spellcheck="false" autocapitalize="none" placeholder="seu@email.com" required>
  <input id="loginSenha" name="password" type="password" autocomplete="current-password" placeholder="senha" required>
  <button type="submit" id="loginBtn">Entrar</button>
  <a href="#" id="loginLink" style="font-size:14px;color:#2f6b12;text-align:center">Esqueci a senha: receber link de acesso no e-mail</a>
  <div class="msg" id="loginMsg" role="status" aria-live="polite"></div>
</form></div>
<title>Nosso Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --canvas:#e9e9e6;--bg:#f3f3f1;--surface:#ffffff;--surface-2:#f7f7f5;--fill:#efefec;--line:#ebebe7;
  --ink:#141414;--ink-2:#3d3d3a;--ink-3:#77776f;--ink-4:#a9a9a1;
  --lime:#b9ef7a;--lime-2:#a6e862;--lime-soft:#eef9e0;--lime-ink:#2f6b12;--forest:#1e4a10;--forest-2:#2b6118;
  --on-lime:#173a0b;--lime-tile:rgba(255,255,255,.38);
  --ok:#2f8a2f;--ok-soft:#e9f6e6;--warn:#9a6200;--warn-soft:#fdf2dc;--bad:#d1453b;--bad-soft:#fdeae8;--orange:#f06a2b;
  --c-viagem:#3b82f6;--c-carro:#f06a2b;--c-casa:#4f9d1c;
  --r-sm:12px;--r-md:16px;--r-lg:24px;--r-xl:32px;
  --font-display:'Urbanist','Inter',system-ui,sans-serif;
  --font-ui:'Urbanist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,20,20,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --canvas:#0c0c0b;--bg:#121211;--surface:#1b1b1a;--surface-2:#20201e;--fill:#262624;--line:#2b2b29;
    --ink:#f3f3ef;--ink-2:#d2d2cc;--ink-3:#9c9c95;--ink-4:#6b6b65;
    --lime:#a8e468;--lime-2:#94d652;--lime-soft:#1c2a12;--lime-ink:#a8e468;--forest:#a8e468;--forest-2:#94d652;--on-lime:#132e08;--lime-tile:rgba(255,255,255,.28);
    --ok:#74c66f;--ok-soft:#172617;--warn:#e5b45a;--warn-soft:#2a2211;--bad:#f2766c;--bad-soft:#2d1715;
    --c-viagem:#6ea6fa;--c-carro:#f48b55;--c-casa:#8fd45a;--shadow:none}
}
:root[data-theme="dark"]{color-scheme:dark;
  --canvas:#0c0c0b;--bg:#121211;--surface:#1b1b1a;--surface-2:#20201e;--fill:#262624;--line:#2b2b29;
  --ink:#f3f3ef;--ink-2:#d2d2cc;--ink-3:#9c9c95;--ink-4:#6b6b65;
  --lime:#a8e468;--lime-2:#94d652;--lime-soft:#1c2a12;--lime-ink:#a8e468;--forest:#a8e468;--forest-2:#94d652;--on-lime:#132e08;--lime-tile:rgba(255,255,255,.28);
  --ok:#74c66f;--ok-soft:#172617;--warn:#e5b45a;--warn-soft:#2a2211;--bad:#f2766c;--bad-soft:#2d1715;
  --c-viagem:#6ea6fa;--c-carro:#f48b55;--c-casa:#8fd45a;--shadow:none}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--canvas);color:var(--ink);font:500 15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:16px 40px}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.lucide{width:17px;height:17px;stroke-width:1.8;flex-shrink:0}
a{color:inherit}

.shell{max-width:1240px;margin:0 auto;background:var(--bg);border-radius:var(--r-xl);padding:20px 24px 32px}
.topbar{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:nowrap}
@media (max-width:1180px){.topbar{flex-wrap:wrap}.tabs{order:3;width:100%;flex-basis:100%;justify-content:flex-start}}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.duo{display:flex}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;background:var(--fill);flex-shrink:0}
.duo .ph+.ph{margin-left:-12px;box-shadow:0 0 0 3px var(--bg)}
.hello small{display:block;font-size:13px;color:var(--ink-3);font-weight:500}
.hello b{display:block;font:600 22px/1.15 var(--font-display);letter-spacing:-.01em}
.tabs{display:flex;gap:2px;background:transparent;overflow-x:auto;scrollbar-width:none;max-width:100%;flex:1 1 auto;min-width:0;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:inline-flex;align-items:center;height:40px;padding:0 13px;border-radius:99px;color:var(--ink-3);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--lime);color:var(--on-lime)}
.top-r{display:flex;gap:8px;align-items:center}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.round:hover{background:var(--fill)}
.bellpill{height:44px;border-radius:99px;border:0;background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 12px;cursor:pointer;font-weight:700;text-decoration:none}
.bellpill .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--bad);margin:-12px 0 0 10px}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 4px 14px;flex-wrap:wrap}
.page-h h1{margin:0;font:700 26px/1.1 var(--font-display);letter-spacing:-.02em}
.page-h p{margin:0;font-size:14px;color:var(--ink-3)}
.page{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--fill)}
.btn:focus-visible,.tabs a:focus-visible,input:focus-visible,select:focus-visible,.chip-btn:focus-visible,.round:focus-visible{outline:2px solid var(--forest-2);outline-offset:2px}
.btn-primary{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn-primary:hover{background:var(--forest-2)}
.btn-outline{background:transparent;border-color:var(--ink-4)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-lime{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.go{width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--on-lime);text-decoration:none;flex-shrink:0}
.go svg.lucide{width:26px;height:26px}
.go:hover{background:var(--lime-2)}

.card{background:var(--surface);border-radius:var(--r-lg);min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 22px 0}
.card-h h3{margin:0;font:600 18px/1.2 var(--font-display);display:flex;align-items:center;gap:10px}
.card-h h3 .hi{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.card-h small{font-size:13px;color:var(--ink-3)}
.card-b{padding:16px 22px 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.gh{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}

.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn);font-size:14px}

/* destaque: saldo do dia */
.bal{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.bal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--fill);padding:4px;border-radius:99px;gap:2px}
.seg button,.seg span{border:0;background:transparent;height:34px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg [aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.acct{text-align:right}
.acct small{display:block;font-size:12px;color:var(--ink-3)}
.acct b{font:600 18px/1.3 var(--font-display)}
.bal .lbl{font-size:14px;color:var(--ink-3)}
.bal .big{font:500 64px/1 var(--font-display);letter-spacing:-.03em;display:flex;align-items:center;gap:14px}
.bal .big.neg{color:var(--bad)}
.bal .big .eye{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.bal .sub{font-size:14px;color:var(--ink-3)}
.bal .sub b{color:var(--ink);font-weight:600}
.bal-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal-foot .grow{flex:1}

.reward{background:var(--lime);color:var(--on-lime);border-radius:var(--r-lg);padding:22px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.reward .star{position:absolute;right:-6px;top:-6px;width:170px;height:170px;opacity:.5}
.reward .star path{fill:var(--lime-2)}
.prio{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 18px;border-radius:99px;background:var(--forest);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;align-self:flex-start;position:relative}
:root[data-theme="dark"] .prio{color:var(--on-lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prio{color:var(--on-lime)}}
.prio i{width:30px;height:30px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--on-lime)}
.reward .k{font-size:14px;position:relative}
.reward .v{font:500 44px/1 var(--font-display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.reward .v .tag{font:600 12px/1 var(--font-ui);background:#fff;color:var(--lime-ink);padding:6px 10px;border-radius:99px;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative}
.tile{background:var(--lime-tile);border-radius:var(--r-md);padding:12px 14px}
.tile small{display:block;font-size:12px}
.tile b{display:flex;align-items:center;gap:6px;font:600 20px/1.3 var(--font-display);margin-top:4px}

/* anel de gastos */
.ring{display:grid;place-items:center;position:relative;margin:4px auto 0;width:200px;max-width:100%}
.ring svg{width:100%;height:auto;display:block}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font:600 26px/1.1 var(--font-display);display:block}
.ring .c span{font-size:13px;font-weight:700}
.hint{display:flex;justify-content:center;margin-top:10px}
.hint span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.catlegend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:14px;font-size:13px;color:var(--ink-3)}
.catlegend div{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catlegend div.on{color:var(--ink)}

/* barras de contas */
.ebars{display:flex;flex-direction:column;gap:14px}
.ebar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.ebar .row b{color:var(--ink);font-weight:600}
.track{height:10px;border-radius:99px;background:var(--fill);position:relative}
.track i{display:block;height:100%;border-radius:99px;background:var(--ink-4)}
.track.hl i{background:var(--lime)}
.track .knob{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--forest);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px}
:root[data-theme="dark"] .track .knob{color:var(--on-lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .track .knob{color:var(--on-lime)}}
.target{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-weight:700}
.target span{display:flex;align-items:center;gap:6px}
.target i{display:block;width:56px;height:4px;border-radius:2px;background:var(--orange)}
.bigval{font:500 38px/1 var(--font-display);letter-spacing:-.02em}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .main-t{flex:1;min-width:0}
.li .main-t b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .main-t span{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.li .val{font-weight:700;white-space:nowrap;text-align:right}
.li .val.neg{color:var(--bad)}
.ph.sm{width:20px;height:20px}
.ph.md{width:40px;height:40px}
.ph-wrap{position:relative;flex-shrink:0}
.ph-wrap .cat{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.ph-wrap .cat svg.lucide{width:12px;height:12px}
.alertrow{border:1.5px solid #f6d2c4;background:#fffaf7;border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
:root[data-theme="dark"] .alertrow{background:#22160f;border-color:#4a2a1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alertrow{background:#22160f;border-color:#4a2a1a}}
.alertrow .main-t{flex:1;min-width:0}
.alertrow b{display:block;font-weight:600;font-size:14px}
.alertrow span{font-size:12px;color:var(--orange);font-weight:600}
.okbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;cursor:pointer}
.xbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.date-chip{width:46px;flex-shrink:0;text-align:center;border-radius:14px;padding:5px 0;background:var(--fill)}
.date-chip b{display:block;font:700 17px/1.1 var(--font-display)}
.date-chip span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.date-chip.soon{background:#fdeee6;color:var(--orange)}
.date-chip.soon span{color:var(--orange)}
.date-chip.paid{opacity:.45}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);flex-shrink:0;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--fill);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.lime{background:var(--lime-soft);color:var(--lime-ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--ink-3)}
.stat .k{font-size:13px;color:var(--ink-3)}
.stat .v{font:600 24px/1.2 var(--font-display);letter-spacing:-.01em;margin-top:2px}
.stat .d{font-size:13px;color:var(--ink-3);margin-top:3px}

/* formulários */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.form .w2{grid-column:span 2}.form .w3{grid-column:span 3}.form .w4{grid-column:span 4}.form .w6{grid-column:span 6}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select{height:44px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;min-width:0;width:100%}
.who-pick{display:flex;gap:8px}
.who-pick label{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 5px;border:1.5px solid var(--line);border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;min-width:0}
.who-pick input{position:absolute;opacity:0;width:1px;height:1px}
.who-pick .ph{width:34px;height:34px}
.who-pick label:has(input:checked){border-color:var(--forest-2);background:var(--lime-soft)}
.who-pick label:has(input:focus-visible){outline:2px solid var(--forest-2);outline-offset:2px}

/* gráfico */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{font-family:var(--font-ui);font-size:11px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* metas */
.goal{display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;align-items:center;gap:12px}
.goal-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
.goal-top b{font:600 17px/1.2 var(--font-display)}
.goal-top small{display:block;font-size:13px;color:var(--ink-3)}
.goal .pct{margin-left:auto;font:600 24px/1 var(--font-display)}
.bar{height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.goal-nums{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);gap:8px}
.goal-nums b{color:var(--ink);font-weight:700}
.split{display:flex;height:40px;border-radius:99px;overflow:hidden;gap:3px}
.split div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden}
input[type=range]{width:100%;accent-color:var(--forest-2)}

/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cal .d{min-height:78px;border-radius:14px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{background:transparent}
.cal .d .n{font-size:12px;font-weight:700;color:var(--ink-3)}
.cal .d.today{background:var(--lime-soft);box-shadow:inset 0 0 0 1.5px var(--forest-2)}
.cal .d.today .n{color:var(--lime-ink)}
.ev{font-size:11px;font-weight:600;border-radius:7px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--fill)}
.ev.conta{background:#fdeee6;color:#9b3d12}
.ev.cartao{background:#e8efff;color:#1d4fb8}
.ev.invest{background:var(--lime);color:var(--on-lime)}
.ev.renda{background:var(--ok-soft);color:var(--ok)}
:root[data-theme="dark"] .ev.conta{background:#3a1f12;color:#f4a77c}
:root[data-theme="dark"] .ev.cartao{background:#16223f;color:#9ab8f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ev.conta{background:#3a1f12;color:#f4a77c}:root:not([data-theme="light"]) .ev.cartao{background:#16223f;color:#9ab8f7}}
.gcal{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--surface-2)}
.gcal .main-t{flex:1;min-width:0}
.gcal b{display:block;font-weight:600}
.gcal span{font-size:13px;color:var(--ink-3)}
.gmark{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex-shrink:0;border:1.5px solid var(--line)}

/* assistente */
.qr-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.qr{width:190px;height:190px;border-radius:20px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;padding:12px}
.qr img,.qr canvas{width:164px!important;height:164px!important}
.qr .empty{font-size:13px;color:#77776f;text-align:center;padding:10px}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.wa{background:#e9e4dc;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
:root[data-theme="dark"] .wa{background:#0e1512}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{background:#0e1512}}
.bubble{background:#fff;color:#111;border-radius:12px 12px 12px 3px;padding:9px 11px 6px;max-width:92%;font-size:13px;line-height:1.45;white-space:pre-wrap;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-weight:400}
.bubble.me{align-self:flex-end;background:#d9fdd3;border-radius:12px 12px 3px 12px}
.bubble .t{display:block;text-align:right;font-size:10px;color:#667;margin-top:2px}
.bubble .from{display:block;font-size:11px;font-weight:700;color:#2f6b12;margin-bottom:2px}
.sched .li .tm{font:700 14px var(--font-display);width:52px;color:var(--ink-2)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;text-align:left;padding:0 8px 8px}
.t td{padding:10px 8px;border-top:1px solid var(--line)}
.t td.r,.t th.r{text-align:right}
.tbl{overflow-x:auto}
.chip-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;height:32px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip-btn.on{background:var(--lime-soft);border-color:transparent;color:var(--lime-ink)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease;border-radius:24px 0 0 24px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:25}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.drawer-h b{flex:1;font:600 17px var(--font-display)}
.ai-dot{width:32px;height:32px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--on-lime)}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 13px;border-radius:16px;background:var(--fill);font-size:14px;white-space:pre-wrap;line-height:1.5}
.msg.u{background:var(--forest);color:#fff;align-self:flex-end;max-width:85%}
.chat-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.chat-f input{flex:1;height:44px;border:1.5px solid var(--line);border-radius:99px;padding:0 14px;background:var(--surface);min-width:0}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:40}
.note{font-size:13px;color:var(--ink-3);line-height:1.5}
.decide .li b{white-space:normal}

/* cartões — mesmo desenho do financeiro da Chatfor (grafite + marca limão) */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.dash-main,.dash-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.ccard{position:relative;border-radius:16px;padding:16px 18px;color:#fff;background:#111;aspect-ratio:1.62/1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 12px 28px -12px rgba(0,0,0,.45)}
.ccard::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.10),transparent 55%);pointer-events:none}
.ccard-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.ccard-mark{color:#99ea48;display:flex}
.ccard-chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#d9d9d9,#9d9d9d);margin-top:16px;opacity:.9}
.ccard-num{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;margin-top:12px;opacity:.85}
.ccard-bot{margin-top:auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ccard-bot small{display:block;font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.06em}
.ccard-bot b{font-size:14px;font-weight:600}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,340px));gap:16px}
.ccard-link{text-decoration:none;display:block;border-radius:16px}
.ccard-link.on{outline:2px solid var(--forest-2);outline-offset:3px}
.fats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);gap:8px;overflow-x:auto;padding:2px}
.fat{border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--surface);min-width:110px;cursor:pointer}
.fat:hover{border-color:var(--ink-4)}
.fat.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fat small{font-size:11px;color:var(--ink-3);text-transform:capitalize;font-weight:600}
.fat b{font:700 16px var(--font-display)}
.fat span{font-size:11px;color:var(--ink-3)}
.fat.aberta small{color:var(--warn)}.fat.paga small{color:var(--ok)}
.sc{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.sc .l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3)}
.sc .v{font:600 22px/1.2 var(--font-display)}
.sc .d{font-size:12px;color:var(--ink-3)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rows .li .main-t span{display:block}
@media (max-width:1180px){.dash{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.ccards{grid-template-columns:minmax(0,1fr)}.ccard{max-width:360px}}

/* dízimo */
.tithe{background:#1d1530;color:#fff;border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.tithe .k{font-size:14px;color:#cfc4e6}
.tithe .v{font:500 52px/1 var(--font-display);letter-spacing:-.03em}
.tithe .sub{font-size:14px;color:#cfc4e6}
.tithe .sub b{color:#fff}
.tithe .meter{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tithe .meter i{display:block;height:100%;border-radius:99px;background:var(--lime)}
.tithe .glow{position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(185,239,122,.28),transparent 65%)}
.verse{border-left:3px solid var(--lime-2);padding:4px 0 4px 14px;font-size:15px;color:var(--ink-2);font-style:italic}
.verse cite{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:4px;font-weight:700}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.mon{border-radius:var(--r-md);background:var(--surface-2);padding:10px;display:flex;flex-direction:column;gap:2px}
.mon small{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mon b{font:600 15px var(--font-display)}
.mon span{font-size:11px}
.ev.dizimo{background:#f3e8ff;color:#6b21a8}
.ev.google{background:#e3f0ff;color:#174ea6;border-left:3px solid #4285f4}
.ical{margin-top:14px;padding:16px;border-radius:var(--r-md);background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.ical .passo{display:flex;gap:12px}
.ical .passo > div > span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.ical .nro{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.link-ics{display:block;margin-top:8px;font-size:11px;word-break:break-all;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px;user-select:all}
:root[data-theme="dark"] .ev.dizimo{background:#2a1840;color:#d8b4fe}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ev.dizimo{background:#2a1840;color:#d8b4fe}}
@media (max-width:720px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}.tithe .v{font-size:40px}}

[hidden]{display:none!important}
/* janela de lançar gasto */
.modal{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.3);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:var(--r-lg);width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto}
@media (max-width:720px){.modal{place-items:end center;padding:0}.modal-box{border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}

/* assinaturas */
.subs{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.sub-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 16px var(--font-display);color:#fff;flex-shrink:0}
.sub-tot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sub-tot b{font:500 34px/1 var(--font-display);letter-spacing:-.02em}
.sug{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--lime-soft);color:var(--lime-ink);font-size:13px}
.sug .main-t{flex:1;min-width:0}
details.canc summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-3);margin-top:8px}
@media (max-width:1040px){.subs{grid-template-columns:minmax(0,1fr)}}

/* formas de pagamento */
.pill.fm-credito{background:#e8efff;color:#1d4fb8}.pill.fm-debito{background:#f3e8ff;color:#6b21a8}.pill.fm-pix{background:#e0f7f4;color:#0f766e}
.pill.fm-boleto,.pill.fm-conta_consumo{background:#fdeee6;color:#9b3d12}.pill.fm-entrada{background:var(--ok-soft);color:var(--ok)}.pill.fm-dinheiro{background:#fef3c7;color:#92400e}
:root[data-theme="dark"] .pill.fm-credito{background:#16223f;color:#9ab8f7}:root[data-theme="dark"] .pill.fm-debito{background:#2a1840;color:#d8b4fe}:root[data-theme="dark"] .pill.fm-pix{background:#0f2a27;color:#5eead4}:root[data-theme="dark"] .pill.fm-boleto,:root[data-theme="dark"] .pill.fm-conta_consumo{background:#3a1f12;color:#f4a77c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.fm-credito{background:#16223f;color:#9ab8f7}:root:not([data-theme="light"]) .pill.fm-debito{background:#2a1840;color:#d8b4fe}:root:not([data-theme="light"]) .pill.fm-pix{background:#0f2a27;color:#5eead4}:root:not([data-theme="light"]) .pill.fm-boleto,:root:not([data-theme="light"]) .pill.fm-conta_consumo{background:#3a1f12;color:#f4a77c}}
.li .main-t span .pill{font-size:10px;padding:2px 7px}
.li .main-t span.pill,.li .main-t b .pill{display:inline-flex;width:auto}
.t .ph{display:inline-block;vertical-align:-5px;margin-right:4px}

/* blocos recolhíveis (abertos no computador, fechados no celular) */
details.dobra > summary{list-style:none}
details.dobra > summary::-webkit-details-marker{display:none}
@media (min-width: 721px){details.dobra > summary{display:none}}
/* toque, foco e rolagem */
html{-webkit-tap-highlight-color:transparent;text-size-adjust:100%}
button,a,input,select,textarea,label,summary{touch-action:manipulation}
:focus-visible{outline:2px solid var(--forest-2);outline-offset:2px}
.modal,.modal-box,.drawer,.chat{overscroll-behavior:contain}
h1,h2,h3{text-wrap:balance}
section[id],#page{scroll-margin-top:16px}
#page:focus{outline:none}
.skip{position:fixed;left:16px;top:-60px;z-index:60;background:var(--forest);color:#fff;border:0;border-radius:99px;padding:10px 16px;font-weight:600}
.skip:focus-visible{top:calc(12px + env(safe-area-inset-top,0px))}
.btn,.round,.fab,.chip-btn,.okbtn,.go,.tabs a,.seg span{transition:transform .12s ease,background-color .15s ease,color .15s ease}
.btn:active,.round:active,.fab:active,.chip-btn:active,.okbtn:active,.go:active{transform:scale(.96)}
@media (prefers-reduced-motion: reduce){.btn,.round,.fab,.chip-btn,.okbtn,.go,.tabs a,.seg span{transition:none}.btn:active,.round:active,.fab:active,.chip-btn:active,.okbtn:active,.go:active{transform:none}}
@media (pointer: fine){html{overscroll-behavior:none}}
/* navegação: ícones só no celular */
.tabs a svg.lucide{display:none}
.fab{display:none}
@media (max-width: 720px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .shell{padding-bottom:24px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;order:initial;width:auto;flex-basis:auto;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:0;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
  nav.tabs a{flex-direction:column;gap:3px;height:auto;padding:6px 4px;font-size:11px;border-radius:14px;flex:1;justify-content:center}
  nav.tabs a svg.lucide{display:block;width:21px;height:21px}
  nav.tabs a[aria-current="page"]{background:var(--lime-soft);color:var(--lime-ink)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--forest);color:#fff;z-index:21;box-shadow:0 8px 24px rgba(30,74,16,.35);cursor:pointer}
  .fab svg.lucide{width:26px;height:26px}
  .topbar{gap:10px}
  .top-r .round,.top-r .bellpill{width:40px;height:40px}
  .top-r .bellpill{width:auto;padding:0 12px}
  .page-h{margin:14px 2px 10px}
  .page-h h1{font-size:22px}
  .so-desk{display:none}
  input,select,textarea,.fld input,.fld select,.chat-f input{font-size:16px}
  #assinaturas .li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:8px;align-items:center}
  #assinaturas .li > .sub-ic{grid-row:1 / 3;align-self:start}
  #assinaturas .li > .main-t{grid-column:2;grid-row:1}
  #assinaturas .li > .main-t b{white-space:normal}
  #assinaturas .li > .val{grid-column:3;grid-row:1;align-self:start}
  #assinaturas .li > .chip-btn{grid-column:2;grid-row:2;justify-self:start}
  #assinaturas .li > .btn{grid-column:3;grid-row:2;justify-self:end}
  .t{font-size:13px}
  .t .pill{font-size:10px;padding:3px 7px}
  .t td.desc{max-width:120px}
  .chip-btn{min-height:36px}
  .btn-sm{min-height:36px}
  html,body{overflow-x:hidden}
  .page > *{max-width:100%}
  .gcal{flex-wrap:wrap}
  .gcal .btn{margin-left:52px}
  .bal-foot .go{display:none}
  .bal-foot .grow{display:none}
  details.dobra > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:16px;font:600 17px var(--font-display)}
  details.dobra > summary::after{content:'+';font-size:22px;color:var(--ink-3)}
  details.dobra[open] > summary::after{content:'–'}
  details.dobra > summary + *{margin-top:-8px}
  .bal{padding:18px}
  .bal-top .seg{order:2}
  .bal .big{font-size:42px}
  .bal-foot .go{width:52px;height:52px}
  .reward{padding:18px}
  .reward .v{font-size:30px}
  .card-h{padding:16px 16px 0}
  .card-b{padding:12px 16px 18px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .t td,.t th{padding:8px 6px}
  .t td.desc{max-width:150px}
}

/* faturas */
.drop{border:2px dashed var(--ink-4);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface-2);cursor:pointer;position:relative}
.drop.over{border-color:var(--forest-2);background:var(--lime-soft)}
.drop b{font-size:15px}
.drop span{font-size:13px;color:var(--ink-3)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.prev-sum{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.t select.mini{height:30px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 6px;font-size:12px}
.t td.desc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.itens summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:6px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{margin-top:3px}

@media (max-width: 1040px){
  .g2,.g3,.gh{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 720px){
  body{padding:0}
  .shell{border-radius:0;padding:14px 16px 40px}
  .tabs{order:3;width:100%}
  .tabs a{height:36px;padding:0 14px}
  .hello b{font-size:18px}
  .ph{width:38px;height:38px}
  .top-r .hide-sm{display:none}
  .bal .big{font-size:46px}
  .reward .v{font-size:34px}
  .g2e{grid-template-columns:minmax(0,1fr)}
  .form .w2,.form .w3,.form .w4{grid-column:span 3}
  .qr-box{grid-template-columns:minmax(0,1fr);justify-items:center}
  .cal{gap:3px}
  .cal .d{min-height:50px;padding:4px;border-radius:10px}
  .cal .ev{font-size:0;height:6px;padding:0;border-radius:3px}
  .acct{display:none}
}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}


/* contas fixas editáveis */
.fixas{display:flex;flex-direction:column}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px 120px 40px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx label{display:flex;flex-direction:column;gap:4px;min-width:0}

const hoje = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()) }
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`

const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']

const brl = (v, cents = true) => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 })

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const mesKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`

// ───────────────────────── Contas do mês ─────────────────────────
// Dízimo: valor fixo combinado (por enquanto R$ 1.000 do líquido); sem valor fixo, usa o percentual sobre o que entrou.
const dizimoFixo = () => +S.cfg.dizimoFixo || 0
const dizimoDoMes = (renda) => dizimoFixo() || Math.round(renda * (+S.cfg.dizimoPct || 0)) / 100
const dizimoRegra = () => dizimoFixo() ? `valor fixo de ${brl(dizimoFixo(), false)}` : `${S.cfg.dizimoPct}% do que entrou`
// Cartão: quando a fatura do mês foi anexada, o valor real substitui o previsto.
const faturaDe = (x, mk) => x.tipo === 'cartao' ? S.faturas[`${x.id}_${mk}`] : null
// Cartão não é conta fixa: o que se compra nele já desconta do limite do dia. O valor da fatura serve só para a data de pagar.
const valorDe = (x, mk) => { if (x.tipo !== 'cartao') return +x.valor || 0; const f = faturaDe(x, mk); if (f) return +f.total || 0; const soma = itensDaFatura(x, mk).reduce((a, i) => a + i.valorFat, 0); return soma || +x.valor || 0 }
// Parcelas e assinaturas que caem nas faturas que vencem neste mês: compromisso do mês, fora do limite do dia
const parcelasDoMes = (mk) => CARTOES().reduce((a, x) => a + itensDaFatura(x, mk).filter((i) => !i.fromGasto).reduce((b, i) => b + i.valorFat, 0), 0)
function calc() {
  const t = hoje(), dia = t.getDate(), dias = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()
  const mk = mesKey(t)
  const rendaFixa = Object.values(S.cfg.rendas).reduce((a, b) => a + (+b || 0), 0)
  const extras = S.entradas.filter((e) => e.data.startsWith(mk)).reduce((a, e) => a + (+e.valor || 0), 0)
  const renda = rendaFixa + extras
  const dizimo = dizimoDoMes(renda)
  const dizimoEntregue = S.dizimos.filter((d) => d.data.startsWith(mk) && d.tipo !== 'oferta').reduce((a, d) => a + (+d.valor || 0), 0)
  const ofertasMes = S.dizimos.filter((d) => d.data.startsWith(mk) && d.tipo === 'oferta').reduce((a, d) => a + (+d.valor || 0), 0)
  const fixas = S.contas.filter((x) => x.tipo !== 'cartao').reduce((a, x) => a + (+x.valor || 0), 0)
  const parcelasMes = parcelasDoMes(mk)
  const meta = +S.cfg.metaMensal || 0
  const livre = renda - dizimo - fixas - parcelasMes - meta
  const limiteDia = livre / dias
  const doMes = S.gastos.filter((g) => g.data.startsWith(mk))
  const porDia = Array.from({ length: dias }, () => 0)
  doMes.forEach((g) => { porDia[parse(g.data).getDate() - 1] += +g.valor || 0 })
  const gastoHoje = porDia[dia - 1]
  const ateOntem = porDia.slice(0, dia - 1).reduce((a, b) => a + b, 0)
  const sobraAcumulada = limiteDia * (dia - 1) - ateOntem   // positivo = economizou nos dias anteriores
  const podeHoje = limiteDia + sobraAcumulada - gastoHoje
  const gastoMes = ateOntem + gastoHoje
  const ritmo = dia > 1 ? ateOntem / (dia - 1) : gastoHoje
  const projMes = gastoMes + ritmo * (dias - dia)
  const economiaProj = renda - dizimo - fixas - parcelasMes - projMes
  const ontem = new Date(t); ontem.setDate(dia - 1)
  const gastosOntem = S.gastos.filter((g) => g.data === iso(ontem))
  const aportadoMes = S.aportes.filter((a) => a.data.startsWith(mk)).reduce((a, b) => a + (+b.valor || 0), 0)
  const pagos = S.contas.filter((x) => x.tipo !== 'cartao' && S.pagos[`${mk}_${x.id}`]).reduce((a, x) => a + (+x.valor || 0), 0)
  return { t, dia, dias, mk, renda, rendaFixa, extras, dizimo, dizimoEntregue, ofertasMes, fixas, parcelasMes, meta, livre, limiteDia, porDia, gastoHoje, ateOntem, sobraAcumulada, podeHoje, gastoMes, ritmo, projMes, economiaProj, ontem, gastosOntem, aportadoMes, pagos, doMes }
}
function proximasContas(c, n = 14) {
  return S.contas.map((x) => {

    const pago = !!S.pagos[`${c.mk}_${x.id}`]

}
function metas() {
  const tot = {}
  S.aportes.forEach((a) => { tot[a.meta] = (tot[a.meta] || 0) + (+a.valor || 0) })
  return S.cfg.metas.map((m) => {
    const guardado = tot[m.id] || 0, mensal = (S.cfg.metaMensal * m.pct) / 100

}

  const base = cur ? (cur.valorPago ?? (cur.via ? +cur.valor || 0 : 0)) : 0, novo = Math.round((base + delta) * 100) / 100
  if (novo <= 0.01 && cur && (cur.via === 'finalidade' || cur.via === 'regra')) return db.doc('pagamentos/' + id).delete()
  await db.doc('pagamentos/' + id).set({ ...(cur || {}), pago: true, valorPago: Math.max(0, novo), via: cur?.via || 'finalidade', em: new Date().toISOString(), ...(desc ? { desc } : {}) })
}
async function classificar(fin, ext, g) {
  if (!db) return toast('Faça login para classificar.')
  const ref = ext || g, valor = ext ? Math.abs(+ext.valor) : +g.valor, quem = ref.quem
  g = g || S.gastos.find((x) => x.quem === quem && Math.abs(+x.valor - valor) < 0.02 && pertoDias(x.data, ref.data))
  ext = ext || S.extrato.find((x) => x.quem === quem && Math.abs(-x.valor - valor) < 0.02 && pertoDias(x.data, ref.data))
  const antes = ext ? finDeExt(ext) : 'gasto', desc = ref.desc || ''
  try {
    if (antes !== fin) await ajustaPag(antes, ref.data, -valor)
    if (fin === 'gasto') { if (!g) await db.collection('gastos').add({ data: ref.data, desc, quem, conta: ext?.conta || '', forma: ext?.meio || 'pix', valor, cat: 'outros', origem: 'extrato', ts: new Date().toISOString() }) }
    else { if (g) await db.doc('gastos/' + g.id).delete(); if (antes !== fin) await ajustaPag(fin, ref.data, valor, desc) }
    // o extrato guarda a escolha (e permite desfazer); gasto lançado à mão ganha uma linha de extrato para não sumir
    if (ext) await db.doc('extrato/' + ext.id).update({ finalidade: fin, destino: rotuloFin(fin) })
    else await db.doc('extrato/man-' + g.id).set({ data: g.data, desc, valor: -valor, meio: formaDe(g), quem, conta: g.conta || '', banco: '', finalidade: fin, destino: rotuloFin(fin) })
    const chave = chaveDe(desc), lembra = chave.length >= 4 && !CHAVE_GENERICA.test(chave)
    const rid = chave.replace(/\s+/g, '-')
    if (lembra && fin !== 'gasto') await db.doc('regras/' + rid).set({ chave, fin, nome: desc.slice(0, 80), em: new Date().toISOString() })
    if (lembra && fin === 'gasto' && S.regras[rid]) await (S.regras[rid].cat ? db.doc('regras/' + rid).set({ ...S.regras[rid], fin: 'gasto' }) : db.doc('regras/' + rid).delete())
    toast(fin === 'gasto' ? 'Voltou a contar como gasto do dia.' : `${rotuloFin(fin).replace(/^./, (x) => x.toUpperCase())}.${lembra ? ' Os próximos para o mesmo destino já entram assim.' : ''}`)
  } catch { toast('Não salvou. Tente de novo.') }
}

function chartDias(c) {
  const el = document.getElementById('chartDias'); if (!el) return
  const W = 1100, H = 230, L = 38, R = 8, T = 14, B = 24, n = c.dias
  const max = Math.max(c.limiteDia * 2, ...c.porDia) * 1.08
  const bw = (W - L - R) / n, y = (v) => T + (H - T - B) * (1 - v / max)
  const ticks = [0, Math.round(c.limiteDia), Math.round(max / 50) * 50 > c.limiteDia * 1.4 ? Math.round(max * 0.9 / 50) * 50 : null].filter((v) => v != null)
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por dia contra o limite diário">`
  ticks.forEach((v) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" /><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v.toLocaleString('pt-BR')}</text>` })
  c.porDia.forEach((v, i) => {
    const x = L + i * bw + 2, w = Math.max(2, bw - 4), fut = i + 1 > c.dia
    if (fut) s += `<rect x="${x}" y="${y(c.limiteDia)}" width="${w}" height="${y(0) - y(c.limiteDia)}" fill="var(--fill)" rx="2"><title>Dia ${i + 1}: limite ${brl(c.limiteDia)}</title></rect>`
    else s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, y(0) - y(v))}" fill="${v > c.limiteDia ? 'var(--bad)' : i + 1 === c.dia ? 'var(--ink)' : 'var(--lime)'}" rx="2"><title>Dia ${i + 1}: ${brl(v)}</title></rect>`
    if ((i + 1) % 5 === 0 || i === 0) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`
  })
  s += `<line x1="${L}" x2="${W - R}" y1="${y(c.limiteDia)}" y2="${y(c.limiteDia)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${y(c.limiteDia) - 5}" text-anchor="end" style="fill:var(--ink);font-weight:600">limite ${brl(c.limiteDia, false)}/dia</text></svg>`
  el.innerHTML = s
}

const VAPID_PUB = 'BOz3SaoAJBPQ-EIb2az77O_yind_mNWH4W8xaw6cbAgjADANiG7gWSyUH9J7s2JNNH3EvMkReDySw-JQDnmvvCk'
const NT = { estado: null }
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
const b64u = (s) => { const p = '='.repeat((4 - (s.length % 4)) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)) }
async function estadoNotif() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return ehIOS() && !instalado() ? 'instalar' : 'sem-suporte'
  if (Notification.permission === 'denied') return 'negado'
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription()
  return sub ? 'ativo' : 'desligado'
}
function notifCard() {
  if (NT.estado === null) { estadoNotif().then((e) => { NT.estado = e; render() }).catch(() => { NT.estado = 'sem-suporte'; render() }) }
  const e = NT.estado
  const txt = { ativo: 'Ligadas neste celular. Avisos de contas vencendo, limite do dia e gastos novos do banco.', desligado: 'Receba no celular: conta vencendo, limite do dia estourado e gasto novo do banco para classificar.', negado: 'O celular bloqueou as notificações deste app. Libere em Ajustes do celular › Notificações › Nosso Caixa e volte aqui.', instalar: 'No iPhone, as notificações só funcionam com o app na Tela de Início: no Safari, toque em Compartilhar › Adicionar à Tela de Início e abra por lá.', 'sem-suporte': 'Este navegador não recebe notificações. Abra o app instalado na tela de início do celular.' }[e] || 'Verificando…'
  return `<section class="card"><div class="card-h"><h3><span class="hi"><i data-lucide="bell-ring"></i></span>Notificações</h3>${e === 'ativo' ? '<span class="pill ok">ligadas</span>' : ''}</div>

    ${e === 'ativo' ? '<button class="btn btn-sm btn-ghost" type="button" id="ntOff">Desligar neste celular</button>' : ''}
    </div></section>`
}
async function ligaNotif() {
  try {
    const perm = await Notification.requestPermission()
    if (perm !== 'granted') { NT.estado = perm === 'denied' ? 'negado' : 'desligado'; return render() }
    const reg = await navigator.serviceWorker.ready
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) })
    const j = sub.toJSON(), id = 'sub-' + Array.from(new TextEncoder().encode(j.endpoint)).reduce((h, c) => (h * 31 + c) >>> 0, 7).toString(36)
    if (db) await db.doc('push_subs/' + id).set({ endpoint: j.endpoint, keys: j.keys, quem: window.claudeUser?.pessoa?.() || null, aparelho: ehIOS() ? 'iPhone' : /android/i.test(navigator.userAgent) ? 'Android' : 'computador', em: new Date().toISOString() })
    NT.estado = 'ativo'; toast('Notificações ligadas neste celular.'); render()
  } catch (err) { toast('Não ligou: ' + (err.message || err)); }
}
async function desligaNotif() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription()
    if (sub) { const j = sub.toJSON(), id = 'sub-' + Array.from(new TextEncoder().encode(j.endpoint)).reduce((h, c) => (h * 31 + c) >>> 0, 7).toString(36); await sub.unsubscribe(); if (db) await db.doc('push_subs/' + id).delete() }
    NT.estado = 'desligado'; toast('Notificações desligadas neste celular.'); render()
  } catch { toast('Não desligou. Tente de novo.') }
}

  ['casa', /leroy|telhanorte|tok ?stok|camicado|etna|madeira|condom|claro|vivo|tim |net |internet|sabesp|edp|enel/i],
]
const guessCat = (d) => (GUESS.find(([, re]) => re.test(d)) || ['outros'])[0]
const num = (v) => { if (typeof v === 'number') return v; let t = String(v || '').replace(/[R$\s]/g, ''); if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.'); else t = t.replace(/,/g, ''); return parseFloat(t) }
const toIso = (v) => { const t = String(v || '').trim(); let m
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`
  if ((m = t.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`
  return '' }
const PAGAMENTO = /pagamento (recebido|efetuado|de fatura)|pgto|payment|cr[eé]dito de pagamento/i

function lerCSV(txt) {
  const linhas = txt.replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim())
  const sep = (linhas[0].match(/;/g) || []).length > (linhas[0].match(/,/g) || []).length ? ';' : ','
  const split = (l) => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = '' } else cur += ch } out.push(cur); return out.map((x) => x.trim()) }
  const head = split(linhas[0]).map((h) => h.toLowerCase())
  const col = (re) => head.findIndex((h) => re.test(h))
  const iD = col(/^(date|data)/), iT = col(/title|descri|estabelec|hist|lan[cç]amento/), iV = col(/amount|valor/)
  if (iD < 0 || iV < 0) throw new Error('Não achei as colunas de data e valor neste CSV.')
  return linhas.slice(1).map(split).map((c) => ({ data: toIso(c[iD]), desc: c[iT] ?? '', valor: num(c[iV]) })).filter((x) => x.data && isFinite(x.valor))
}
function lerOFX(txt) {
  const out = []
  for (const b of txt.split(/<STMTTRN>/i).slice(1)) {
    const tag = (n) => (b.match(new RegExp('<' + n + '>([^<\\r\\n]+)', 'i')) || [])[1]?.trim()
    const v = num(tag('TRNAMT')); if (!isFinite(v)) continue
    out.push({ data: toIso(tag('DTPOSTED')), desc: tag('MEMO') || tag('NAME') || '', valor: -v })   // no OFX de cartão, compra vem negativa
  }
  if (!out.length) throw new Error('Não achei lançamentos neste OFX.')
  return out
}
async function carregarPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib
  await new Promise((ok, err) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; sc.onload = ok; sc.onerror = () => err(new Error('Não carreguei o leitor de PDF.')); document.head.appendChild(sc) })
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
  return window.pdfjsLib
}
async function lerPDF(file, senha) {
  const lib = await carregarPdfJs()
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), password: senha || undefined }).promise
  let texto = ''
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await (await pdf.getPage(i)).getTextContent()
    const linhas = {}; pg.items.forEach((it) => { const y = Math.round(it.transform[5]); (linhas[y] = linhas[y] || []).push(it) })
    texto += Object.keys(linhas).sort((a, b) => b - a).map((y) => linhas[y].sort((a, b) => a.transform[4] - b.transform[4]).map((it) => it.str).join(' ')).join('\n') + '\n'
  }
  if (!sample) throw new Error('O leitor de PDF precisa do copiloto ligado. CSV e OFX funcionam sempre.')
  const ano = hoje().getFullYear()
  const r = await sample.json(`Extraia as compras desta fatura de cartão de crédito brasileira. Responda SÓ JSON no formato {"total": number, "vencimento": "AAAA-MM-DD" ou null, "itens": [{"data": "AAAA-MM-DD", "desc": string, "valor": number}]}.
Regras: valor positivo para compra e negativo para estorno/crédito; ignore "pagamento recebido", saldo anterior, juros informativos e limites; parcelas entram com o valor da parcela e a descrição com "x/y"; se a data vier sem ano, use ${ano} (ou ${ano - 1} se o mês for posterior ao do vencimento). total = valor total da fatura impresso no documento.

TEXTO DA FATURA:
${texto.slice(0, 60000)}`, { modelTier: 'default' })
  if (!r || !Array.isArray(r.itens)) throw new Error('Não consegui entender este PDF.')
  return { itens: r.itens.map((x) => ({ data: toIso(x.data), desc: String(x.desc || ''), valor: num(x.valor) })).filter((x) => x.data && isFinite(x.valor)), total: num(r.total), vencimento: toIso(r.vencimento) }
}
async function importar(file, senha) {
  const box = document.getElementById('fatPrev'); box.innerHTML = '<div class="note">Lendo a fatura…</div>'

  try {

const MARK = '<svg viewBox="402.5 0 34.75 44.4374" fill="currentColor" aria-hidden="true" width="11" height="14"><path d="M402.51 1.27V30.01C402.51 30.71 403.08 31.28 403.78 31.28H421.57C421.9 31.28 422.22 31.41 422.46 31.64L435.09 44.07C435.89 44.86 437.25 44.29 437.25 43.17V1.27C437.24 0.57 436.67 0 435.97 0H403.77C403.07 0 402.5 0.57 402.5 1.27H402.51Z"/></svg>'
const ymAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return mesKey(d) }

const fechamentoDe = (x, ym) => diaEm(fech(x) < +x.dia ? ym : ymAdd(ym, -1), fech(x))

const COR_SUB = ['#e50914', '#1db954', '#3b82f6', '#8b5cf6', '#f06a2b', '#0ea5a4', '#d946ef', '#eab308']
const corSub = (n) => COR_SUB[[...String(n)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % COR_SUB.length]
const NOMES_SUB = [[/apple\.com|itunes/i, 'Apple (iCloud e afins)'], [/google workspace/i, 'Google Workspace'], [/ultravioleta/i, 'Anuidade Nubank Ultravioleta'], [/spotify/i, 'Spotify'], [/ifood club/i, 'iFood Club'], [/netflix/i, 'Netflix'], [/youtube/i, 'YouTube Premium'], [/amazon prime|primevideo/i, 'Amazon Prime'], [/disney/i, 'Disney+'], [/chatgpt|openai/i, 'ChatGPT'], [/claude|anthropic/i, 'Claude']]

}

<script>
// login e liberação da tela
;(async () => {
  const ok = await window.nossoCaixa.pronto
  const tela = document.getElementById('login')
  try { document.getElementById('loginDuo').innerHTML = ph('gabriel') + ph('tainara') } catch {}
  if (ok === true) {
    const { data } = await window.sb.auth.getUser(); window.nossoCaixa.email = data.user?.email || ''
    window.claudeUser = await window.claude.use('user')
    document.body.classList.remove('travado'); return
  }
  tela.hidden = false
  const msg = document.getElementById('loginMsg')
  if (ok === 'sem-convite') {
    document.getElementById('loginTxt').textContent = 'Este e-mail entrou, mas não faz parte da casa. Peça o convite ao Gabriel.'
    document.getElementById('loginEmail').hidden = true
    const b = document.getElementById('loginBtn'); b.textContent = 'Sair'; b.type = 'button'; b.onclick = () => window.nossoCaixa.sair(); return
  }
  document.getElementById('fLogin').addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim().toLowerCase(), password = document.getElementById('loginSenha').value, b = document.getElementById('loginBtn')
    b.disabled = true; b.textContent = 'Entrando…'; msg.className = 'msg'; msg.textContent = ''
    const { error } = await window.sb.auth.signInWithPassword({ email, password })
    b.disabled = false; b.textContent = 'Entrar'
    if (error) { msg.className = 'msg erro'; msg.textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não consegui entrar agora. Tente de novo em instantes.'; return }
    location.reload()
  })
  document.getElementById('loginLink').addEventListener('click', async (e) => {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim().toLowerCase()
    if (!email) { msg.className = 'msg erro'; msg.textContent = 'Digite o seu e-mail acima primeiro.'; return }
    const { error } = await window.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } })
    msg.className = error ? 'msg erro' : 'msg'
    msg.textContent = error ? 'Não consegui enviar. Confira o e-mail.' : 'Pronto. Abra o link que chegou no seu e-mail e depois troque a senha em Ajustes.'
  })
})()
window.nossoCaixa.trocarSenha = (e) => { e.preventDefault(); const v = document.getElementById('novaSenha').value; if (v.length < 8) { toast('Use pelo menos 8 caracteres.'); return false } window.sb.auth.updateUser({ password: v }).then(({ error }) => toast(error ? 'Não consegui trocar a senha.' : 'Senha trocada.')); return false }
// PWA: guarda a tela no aparelho e oferece instalar
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}))
let pedidoInstalar = null
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pedidoInstalar = e; window.nossoCaixa.podeInstalar = true; try { render() } catch {} })
window.nossoCaixa.instalar = async () => {
  if (pedidoInstalar) { pedidoInstalar.prompt(); await pedidoInstalar.userChoice.catch(() => {}); pedidoInstalar = null; window.nossoCaixa.podeInstalar = false; render(); return }
  toast(/iphone|ipad/i.test(navigator.userAgent) ? 'No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".' : 'No menu do navegador, toque em "Instalar app" ou "Adicionar à tela inicial".')
}
window.nossoCaixa.instalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
// arquivo de fatura: abre por link temporário
document.addEventListener('click', async (e) => { const a = e.target.closest('[data-arquivo]'); if (!a) return; e.preventDefault(); try { (await window.claude.use('assets')).abrir(a.dataset.arquivo) } catch { toast('Não consegui abrir o arquivo.') } })
</script>
